name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not submit credentials, private data, or security vulnerabilities here. Use the private security-reporting process for vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe set of steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment or version
      description: Do not include credentials or private infrastructure details.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who or what is affected?
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, personal data, and confidential information.
          required: true
